<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dino Project by Anas</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js"></script>
</head>
<body>
  <h1 class="title">DinoProject by Anas</h1>

  <div class="game-container">
    <div id="score">0000</div>
    <div class="dino-wrapper">
    <img src="img/dino.png" alt="Dino" class="dino">
    <img src="img/dino_left_leg.png" alt="" class="dino_left_leg">
    <img src="img/dino_right_leg.png" alt="" class="dino_right_leg">
   </div>
      <div class="cactus-container">
         <!-- <img src="img/cactus1.png" alt="Cactus" class="cactus"> -->
      </div>
    <div class="cloud-wrapper">
  <div class="cloud cloud1"></div>
  <div class="cloud cloud2"></div>
  <div class="cloud cloud3"></div>
</div>
<div class="bird">
<div class="bird1"></div>  
<div class="bird2"></div>
</div>
<img id="game-over-img" src="img/game-over.png" alt="Game Over">
<img src="img/reset.png" alt="reset" id="reset">
    <img src="img/track.png" alt="Track" class="track">
  </div>
  <div class="btn">
    <button id="invert-btn">Light Mode</button>
  </div>
</body>
</html>
