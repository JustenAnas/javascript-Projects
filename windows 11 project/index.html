<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Windows 11 Project</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Desktop -->
  <div id="desktop"  >
       <video id="boot-video" autoplay muted>
      <source src="video.webm" type="video/mp4">
    </video>
    <div class="startMenu">
      <img src="startmenu.PNG" alt="start">
    </div>
    <!-- Background -->
 
    <div class="desc-icons">
      <img class="chromeicon" src="chromeicon.png" alt="chrome">
      <img class="edgeicon" src="edgeicon.png" alt="edge">
      <img class="recyclebinicon" src="recyclebinicon.png" alt="recycle">
    </div>
    <!-- Taskbar -->
    <div class="taskbar">
      <div class="taskbar-center">
        <img src="icons.PNG" class="task-icon" alt="Start">
      </div> 
          <img class="edgeicon2" src="edgeicon.png" alt="recycle">
      <div class="taskbar-right">
        <img src="taskbarright.PNG" class="task-icon" alt="WiFi">
      </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
